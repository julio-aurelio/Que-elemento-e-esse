<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Que Elemento é Esse? - TCC Química</title>
    <link rel="icon" type="image/png" href="arly.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/lucide@0.460.0/dist/umd/lucide.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=Fira+Code:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: Inter, system-ui, 'Segoe UI', Roboto, sans-serif;
            background:
                radial-gradient(1.5px 1.5px at 12% 18%, #fff9, transparent), radial-gradient(1px 1px at 78% 12%, #fff8, transparent),
                radial-gradient(1.5px 1.5px at 45% 70%, #fff6, transparent), radial-gradient(1px 1px at 88% 60%, #fff8, transparent),
                radial-gradient(1px 1px at 25% 85%, #fff7, transparent), radial-gradient(1.5px 1.5px at 62% 35%, #fff5, transparent),
                radial-gradient(circle at 15% 0%, #6d28d955, transparent 45%), radial-gradient(circle at 90% 100%, #2563eb44, transparent 45%),
                #050510;
            background-attachment: fixed;
            height: 100vh; height: 100dvh; overflow: hidden;
        }
        h1, h2, h3, button, .font-game { font-family: 'Space Grotesk', sans-serif; letter-spacing: -.01em; }
        .font-mono { font-family: 'Fira Code', monospace; }
        .btn-3d { box-shadow: 0 4px 0 #4c1d95; transition: transform .08s, box-shadow .08s; }
        .btn-3d:active { transform: translateY(3px); box-shadow: 0 1px 0 #4c1d95; }
        .btn-3d-cinza { box-shadow: 0 4px 0 #d1d5db; transition: transform .08s, box-shadow .08s; }
        .btn-3d-cinza:active { transform: translateY(3px); box-shadow: 0 1px 0 #d1d5db; }
        .cartao-nivel { box-shadow: 0 6px 0 #c4b5fd; }
        .cartao-nivel:active { transform: translateY(4px); box-shadow: 0 2px 0 #c4b5fd; }
        .flutuar { animation: flutuar 2.4s ease-in-out infinite; }
        @keyframes flutuar { 50% { transform: translateY(-8px) rotate(-4deg); } }
        .pop { animation: pop .35s cubic-bezier(.3, 1.6, .5, 1); }
        @keyframes pop { 0% { transform: scale(.3); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        .tremer { animation: tremer .35s; }
        @keyframes tremer { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
        .confete { position: fixed; top: -14px; width: 9px; height: 14px; border-radius: 2px; z-index: 80; pointer-events: none; animation: cair linear forwards; }
        @keyframes cair { to { transform: translateY(105vh) rotate(720deg); } }
        /* o que o tutorial aponta: fica acima do véu, brilhando, e é a única coisa clicável */
        .foco { position: relative; z-index: 50; outline: 4px solid #facc15; outline-offset: 4px; border-radius: 1rem; animation: brilho 1.2s ease-in-out infinite; }
        #opcoes.foco, #pistas.foco, #placar.foco { background: #fff; }
        @keyframes brilho { 50% { outline-color: rgba(250, 204, 21, .2); } }
        /* cada camada gira numa velocidade; as de fora mais devagar */
        .orbita { transform-origin: 0 0; animation: girar linear infinite; }
        @keyframes girar { to { transform: rotate(360deg); } }
        @media (prefers-reduced-motion: reduce) { .orbita, .flutuar { animation: none; } }
        [hidden] { display: none !important; } /* senão as classes flex/grid vencem o atributo hidden */
        /* barra de rolagem fininha e roxa, igual ao Jogo 3 */
        .rolagem { scrollbar-width: thin; scrollbar-color: #c4b5fd transparent; }
        .rolagem::-webkit-scrollbar { width: 6px; }
        .rolagem::-webkit-scrollbar-thumb { background: #c4b5fd; border-radius: 99px; }
        .rolagem::-webkit-scrollbar-button { display: none; }
        /* alternativas estilo Kahoot: cada cor com sua sombra 3D */
        .opcao { transition: transform .08s, box-shadow .08s, opacity .2s; }
        .opcao:active { transform: translateY(3px); box-shadow: none !important; }
        .k-vermelho { background: #e21b3c; box-shadow: 0 4px 0 #a3132b; }
        .k-azul { background: #1368ce; box-shadow: 0 4px 0 #0d4a94; }
        .k-amarelo { background: #d89e00; box-shadow: 0 4px 0 #9c7200; }
        .k-verde { background: #26890c; box-shadow: 0 4px 0 #1a5e08; }
        .opcao.certa { outline: 4px solid #4ade80; outline-offset: 2px; }
        .opcao.errada { outline: 4px solid #1f2937; outline-offset: 2px; }
        .opcao.apagada { opacity: .3; }
        svg.lucide { width: 1.1em; height: 1.1em; display: inline-block; vertical-align: -.15em; }
    </style>
</head>
<body class="text-gray-800 p-3 md:p-4">
<div class="max-w-5xl mx-auto h-full flex flex-col gap-3">

    <header class="shrink-0 bg-white/95 backdrop-blur-sm rounded-2xl shadow-2xl border border-gray-200 p-3 md:p-4 flex flex-wrap items-center gap-3">
        <img src="arly.png" alt="Arly" class="w-14 h-14 shrink-0 object-contain drop-shadow-md">
        <div>
            <h1 class="text-xl md:text-2xl font-bold bg-gradient-to-r from-purple-600 to-blue-600 bg-clip-text text-transparent">Que Elemento é Esse?</h1>
            <p class="text-xs text-gray-500">Modelo de Bohr | Camadas | Prótons, nêutrons e elétrons</p>
        </div>
        <nav class="ml-auto flex gap-2">
            <button data-acao="tutorial" class="bg-gray-100 hover:bg-gray-200 text-gray-600 px-4 py-2 rounded-xl text-sm font-semibold transition btn-3d-cinza"><i data-lucide="circle-help"></i> Como jogar</button>
            <button data-acao="niveis" class="bg-gray-100 hover:bg-gray-200 text-gray-600 px-4 py-2 rounded-xl text-sm font-semibold transition btn-3d-cinza"><i data-lucide="layers"></i> Níveis</button>
        </nav>
    </header>

    <section id="telaNivel" hidden class="flex-1 min-h-0 overflow-y-auto bg-white/95 rounded-2xl shadow-2xl border border-gray-200 p-6 md:p-10 text-center"></section>

    <section id="arena" hidden class="flex-1 min-h-0 flex flex-col bg-white/95 rounded-2xl shadow-2xl border border-gray-200 p-4 md:p-6">
        <div id="placar" class="shrink-0 flex flex-wrap items-center gap-2 mb-4 p-1"></div>
        <div class="flex-1 min-h-0 grid grid-rows-[minmax(0,1fr)_auto] md:grid-rows-1 md:grid-cols-[1fr_18rem] gap-3 md:gap-4">
            <div class="min-h-0 flex flex-col gap-3">
            <div id="modelo" class="relative flex-1 min-h-0 bg-[#050510] rounded-2xl border-2 border-purple-500/40 shadow-inner overflow-hidden grid place-items-center">
                <span class="absolute top-2 left-3 text-xs font-semibold text-purple-200/80">MODELO DE BOHR</span>
                <svg id="bohr" viewBox="-200 -200 400 400" class="w-full h-full" role="img" aria-label="Modelo de Bohr do elemento"></svg>
                <div id="revelar" class="absolute inset-x-0 bottom-4 text-center pointer-events-none"></div>
            </div>
            <div id="opcoes" class="shrink-0 grid grid-cols-2 gap-2 md:gap-3 p-1"></div>
            </div>
            <aside class="rolagem min-h-0 overflow-y-auto max-h-[35vh] md:max-h-none pr-1">
                <div id="pistas" class="p-1"></div>
            </aside>
        </div>
    </section>
    <p class="shrink-0 text-center text-[10px] text-gray-400">Powered by PubChem API</p>
</div>

<div id="veu" hidden class="fixed inset-0 z-40 bg-[#050510]/60 backdrop-blur-sm"></div>
<div id="falas" hidden class="fixed inset-x-0 top-3 md:top-6 z-[60] px-3"></div>

<script src="elementos.js?v=8"></script>
<script src="jogo.js?v=8"></script>
</body>
</html>
